<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web-Scraping Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <header class="app-header">
    <h1>🕸️ Web-Scraping Chatbot</h1>
    <p>Enter a website URL, scrape its content, and ask questions about it.</p>
  </header>

  <main class="container">

    <!-- ============ URL INPUT / SCRAPE SECTION ============ -->
    <section class="card" id="scrape-section">
      <h2>1. Enter Website URL</h2>
      <div class="url-row">
        <input
          type="text"
          id="url-input"
          placeholder="https://example.com"
          autocomplete="off"
        />
        <button id="scrape-btn">Scrape Website</button>
      </div>

      <div id="loading-indicator" class="loading hidden">
        <div class="spinner"></div>
        <span>Scraping website, please wait...</span>
      </div>

      <div id="status-box" class="status hidden"></div>
    </section>

    <!-- ============ CHAT SECTION (hidden until scrape succeeds) ============ -->
    <section class="card hidden" id="chat-section">
      <div class="chat-header-row">
        <h2>2. Website Chatbot</h2>
        <button id="clear-chat-btn" class="secondary-btn">Clear Chat</button>
      </div>

      <div id="chat-window" class="chat-window">
        <!-- Chat messages get inserted here by script.js -->
      </div>

      <div class="chat-input-row">
        <input
          type="text"
          id="chat-input"
          placeholder="Ask a question about this website..."
          autocomplete="off"
        />
        <button id="send-btn">Send</button>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>Built with Flask, BeautifulSoup, and a simple LLM API.</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
